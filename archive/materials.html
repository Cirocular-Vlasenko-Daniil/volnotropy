@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1418;
    --tint:#141C21;
    --ink:#DCE4E9;
    --ink-mid:#8E9BA4;
    --ink-faint:#65727A;
    --rule:#1F282E;
    --rule-strong:#2E3A42;
    --accent:#5FB6EA;
    --accent-deep:#8ACFF8;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1418;
  --tint:#141C21;
  --ink:#DCE4E9;
  --ink-mid:#8E9BA4;
  --ink-faint:#65727A;
  --rule:#1F282E;
  --rule-strong:#2E3A42;
  --accent:#5FB6EA;
  --accent-deep:#8ACFF8;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Golos Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16.5px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-deep);text-decoration:underline;text-underline-offset:.18em}
.mono{
  font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:.6rem;top:.6rem;background:var(--paper);padding:.4rem .7rem;border:1px solid var(--accent);z-index:9}

/* ---------- сетка: всё прижато к левому краю ---------- */
main{padding-left:var(--pad);padding-bottom:1px}
.col{max-width:42rem;padding-right:1.5rem}

/* ---------- шапка ---------- */
.top{
  position:sticky;top:0;z-index:5;background:var(--paper);
  border-bottom:1px solid var(--rule);
  display:flex;align-items:center;justify-content:space-between;gap:1.25rem;
  padding:.8rem 1.5rem .8rem var(--pad);
}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--ink)}
.brand:hover{color:var(--ink);text-decoration:none}
.brand:hover .mark{color:var(--accent-deep)}
.mark{
  display:block;width:31px;height:28px;flex:none;
  color:var(--accent);background-color:currentColor;
  -webkit-mask:var(--logo) center/contain no-repeat;
          mask:var(--logo) center/contain no-repeat;
}
.wordmark{font-size:.98rem;font-weight:500;letter-spacing:.01em}
.nav{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:flex-end}
.nav a{color:var(--ink-mid)}
.nav a:hover{color:var(--accent);text-decoration:none}
.nav a[aria-current="page"]{color:var(--ink)}

/* ---------- заголовок страницы ---------- */
.strap{font-size:1rem;font-weight:400;line-height:1.5;color:var(--ink-mid);margin:2.1rem 0 0;max-width:29rem}

/* ---------- лента закреплённого ---------- */
.eyebrow{color:var(--ink-faint);margin:2.4rem 0 .7rem}
.pins{
  display:flex;align-items:flex-start;overflow-x:auto;scroll-snap-type:x proximity;
  padding:1px 1.5rem 1rem 0;margin:0;
}
.pins::-webkit-scrollbar{height:5px}
.pins::-webkit-scrollbar-thumb{background:var(--rule-strong)}
.pins::-webkit-scrollbar-track{background:var(--rule)}
.card{
  flex:none;width:205px;aspect-ratio:1/1;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:.85rem .9rem;
  border:1px solid var(--rule-strong);background:var(--tint);
  color:var(--ink);scroll-snap-align:start;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.card + .card{margin-left:-1px}
.card:hover{border-color:var(--accent);color:var(--accent);background:var(--paper);text-decoration:none;position:relative;z-index:1}
.cardtop{display:flex;flex-direction:column;min-height:0}
.card .k{color:var(--ink-faint)}
.card .t{font-size:1rem;line-height:1.32;margin-top:.55rem}
.card .d{color:var(--ink-faint)}

/* ---------- оглавление ---------- */
.reg-head{
  display:flex;justify-content:space-between;align-items:baseline;
  color:var(--ink-faint);padding-bottom:.5rem;border-bottom:1px solid var(--rule-strong);margin-top:2.4rem;
}
.row{
  display:grid;grid-template-columns:7rem 1fr;gap:.15rem 1.2rem;align-items:baseline;
  padding:.7rem 0;border-bottom:1px solid var(--rule);color:var(--ink);
}
.row:hover{text-decoration:none}
.row .date{color:var(--ink-faint)}
.row .name{font-size:1rem;line-height:1.35;transition:color .15s ease}
.row:hover .name{color:var(--accent)}

/* ---------- материалы подряд ---------- */
.entries{margin-top:3.5rem;border-top:1px solid var(--rule-strong)}
.entry{padding:2.4rem 0 2.8rem;border-bottom:1px solid var(--rule);scroll-margin-top:3.6rem}
.entry:target .meta a{color:var(--accent)}
.meta{display:flex;gap:1rem;color:var(--ink-faint);margin:0}
.meta a{color:var(--ink-faint)}
.meta a:hover{color:var(--accent);text-decoration:none}
.entry h2{
  font-size:clamp(1.4rem,3.4vw,1.72rem);font-weight:500;line-height:1.22;
  letter-spacing:-.015em;text-wrap:balance;margin:.5rem 0 0;max-width:28rem;
}
.entry h2 a{color:var(--ink)}
.entry h2 a:hover{color:var(--accent);text-decoration:none}
.lead{font-size:1.05rem;color:var(--ink-mid);margin:.7rem 0 0;max-width:30rem}
.prose{display:flex;flex-direction:column;gap:1.05rem;margin-top:1.6rem;max-width:33rem}
.prose p{margin:0}
.spec{display:flex;flex-direction:column;gap:1rem;margin:.2rem 0}
.spec dt{color:var(--ink-faint);margin-bottom:.1rem}
.spec dd{margin:0}
.times{display:flex;flex-direction:column;gap:.4rem;margin:.1rem 0}
.times .t{color:var(--ink-faint);margin-right:.85rem}
.label{color:var(--ink);font-weight:500;margin:.8rem 0 -.45rem}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.65rem}
.list li{padding-left:1.1rem;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.68em;width:5px;height:5px;background:var(--accent)}

      + (m.cta ? '<a class="act" href="' + m.cta.href + '" target="_blank" rel="noopener">' + m.cta.label + '</a>' : '')
      + '</div>'
      + '<p class="source mono"><a href="' + m.src + '" target="_blank" rel="noopener">опубликовано в телеграме →</a></p>'
      + '</article>').join('');

  return '<div class="col"><h1 class="strap">Внеформатные музыкальные и культурные события в Краснодаре и на Юге России.</h1></div>'

    + '<div class="reg-head mono"><span>содержание</span><span>' + MATERIALS.length + '</span></div>'
    + rows
    + '<div class="entries">' + entries + '</div>'
    + '<p><a class="up mono" href="#/">↑ наверх</a></p>'
    + '</div>';
}

/* ---------- маршрутизация ----------
   Страниц две: главная со всеми материалами и «о нас».
   #/m/<slug> — та же главная, прокрученная к нужному материалу.
   ------------------------------------------------------------------------- */
const main = document.getElementById('main');
let current = null;

function show(view, name, title, nav){
  if (current !== name){ main.innerHTML = view(); current = name; }
  document.title = title;
  document.querySelectorAll('.nav a[data-nav]').forEach(a => {
    if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
}

function route(){
  const path = location.hash.replace(/^#\/?/, '');

  if (path === 'about'){
    show(viewAbout, 'about', 'о нас — волнотропы', 'about');
    window.scrollTo(0, 0);
    return;
  }

  const slug = path.startsWith('m/') ? path.slice(2) : null;
  const m = slug ? MATERIALS.find(x => x.slug === slug) : null;
  const wasRendered = current === 'index';

  show(viewIndex, 'index', m ? m.title + ' — волнотропы' : 'волнотропы', 'index');

  const target = m ? document.getElementById('m-' + m.slug) : null;
  if (!target){ window.scrollTo(0, 0); return; }

  // при первой отрисовке шрифты доезжают позже и сдвигают вёрстку,
  // поэтому прокручиваем ещё раз после кадра и после загрузки шрифтов
  const jump = smooth => target.scrollIntoView({block: 'start', behavior: smooth ? 'smooth' : 'auto'});
  jump(wasRendered);
  if (!wasRendered){
    requestAnimationFrame(() => jump(false));
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => jump(false));
  }
}

addEventListener('hashchange', route);
route();
</script>
